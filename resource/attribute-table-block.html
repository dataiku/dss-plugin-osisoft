<div class="attribute-table-block" ng-if="ctrl.section.shouldDisplay()">
    <div class="attribute-table-block__title"><strong>{{ctrl.section.title}}</strong></div>
    <table class="custom-table">
        <thead>
        <tr>
            <th><input type="checkbox" ng-model="ctrl.groupedAttributes[ctrl.section.key].allChecked"
                       ng-change="ctrl.onToggleSelectAllGroupedAttributes({ groupedAttributeGroup: ctrl.groupedAttributes[ctrl.section.key] })"
                       ng-disabled="!ctrl.groupedAttributes[ctrl.section.key].groups.length"
                       indeterminate="ctrl.groupedAttributes[ctrl.section.key].checked"></th>
            <th>Title</th>
            <th>Description</th>
            <th ng-if="ctrl.config.displayPath">Path</th>
            <th>Data type</th>
            <th>Aggregates</th>
        </tr>
        </thead>
        <tbody ng-if="ctrl.groupedAttributes[ctrl.section.key].empty">
        <tr class="custom-table__empty-row">
            <td colspan="{{ctrl.config.displayPath ? 6 : 5}}">{{ctrl.section.emptyMessage}}</td>
        </tr>
        </tbody>
        <tbody
                ng-repeat="group in ctrl.groupedAttributes[ctrl.section.key].groups track by group.group_name"
                ng-show="!group.isDisplayed">
        <tr class="custom-table__group-row"
            ng-class="{ 'custom-table__group-row--selected': ctrl.onIsAtLeastPartiallySelected({ item: group }) }">
            <td>
                <input type="checkbox" ng-model="group.allChecked"
                       ng-change="ctrl.onToggleGroupedAttributes({ group: group })" indeterminate="group.checked">
            </td>
            <td colspan="{{ctrl.config.displayPath ? 5 : 4}}">
                <div class="custom-table__group-actions">
                    <div>
                        <span class="custom-table__group-name">{{group.group_name}}</span>
                        <span ng-if="group.nbSearchMatches !== group.attributes.length">
                            - ({{group.nbSearchMatches}}/{{group.attributes.length}} attributes shown)
                        </span>
                    </div>
                    <dropdown-elements
                            elements="ctrl.config.elementsByTemplate[group.group_name]"
                            group-name="group.group_name"
                            init-elements-dropdown="ctrl.onInitElementsDropdown({ templateName: templateName })"
                            is-template-associated-element-selected="ctrl.onIsTemplateAssociatedElementSelected({ element: element })"
                            apply-click-elements-dropdown="ctrl.onApplyClickElementsDropdown({ templateName: templateName, element: element, selected: selected })"
                            active-tab="ctrl.config.activeTab"
                            ng-if="ctrl.section.type === 'template'">
                    </dropdown-elements>
                </div>
            </td>
        </tr>
        <tr
                ng-repeat="mergedAttribute in group.attributes track by mergedAttribute.title"
                ng-show="mergedAttribute.isDisplayed"
                attribute-table-row
                merged-attribute="mergedAttribute"
                display-path="ctrl.config.displayPath"
                aggregate-data-type-fields="ctrl.aggregateDataTypeFields"
                on-check-attribute="ctrl.onCheckAttribute({ mergedAttribute: mergedAttribute })"
                on-update-data-type="ctrl.onUpdateDataType({ mergedAttribute: mergedAttribute })"
                on-update-aggregate="ctrl.onUpdateAggregate({ mergedAttribute: mergedAttribute })"
                ng-class="{ 'custom-table__attribute-row--selected': ctrl.onIsAtLeastPartiallySelected({ item: mergedAttribute }) }">
        </tr>
        </tbody>
    </table>
</div>
