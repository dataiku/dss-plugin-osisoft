<div class="modal modal3 pi-system-auth-modal" auto-size="false">
    <div dku-modal-header modal-title="Welcome to PI System plugin" />
    <div class="modal-body" style="display: flex; flex-direction: column; gap: 25px;">
        <div class="pi-system-config--mandatory">
            <div>
                <label for="pi-system-credentials">Pi System connection</label>
                <div>
                    <div autoconfig-preset-element param-desc="paramDesc" model="config.credentials"
                         plugin-id="pi-system"
                         accessible-parameter-set-descriptions="accessibleParameterSetDescriptions"
                         accessible-presets="accessiblePresets" inline-params="inlineParams"
                         inline-plugin-params="inlinePluginParams" error-scope="errorScope" required>
                    </div>
                </div>
            </div>
            <div class="removed-if-manual-query">
                <label>Server</label>
                <div>
                    <select dku-bs-select ng-model="config.server_name"
                            ng-options="sv.value as sv.label for sv in server_name" ng-init="getServers()"
                            ng-change="onServerChanged()"
                            ng-disabled="!(config.credentials && config.credentials.mode && config.credentials.mode !== 'NONE' && config.credentials.name)">
                    </select>
                </div>
            </div>
            <div class="removed-if-manual-query">
                <label>Database</label>
                <div>
                    <select dku-bs-select ng-init="config.server_name && getDatabases()" ng-model="config.database_name"
                            ng-change="onDatabaseChanged()" ng-options="dbn.value as dbn.label for dbn in database_name"
                            ng-disabled="!config.server_name">
                    </select>
                </div>
            </div>
        </div>
        <div class="pi-system-config--toggle-advanced">
            <input type="checkbox" ng-model="config.show_advanced_parameters" ng-change="onAdvancedToggle();"/>
            Advanced parameters
        </div>
        <div class="pi-system-config--params-advanced" ng-if="config.show_advanced_parameters">
            <div class="pi-system-config--ssl-check">
                <input type="checkbox" style="vertical-align: baseline"
                       ng-model="config.is_ssl_check_disabled" ng-change="getServers();"/>
                Disable SSL Check
            </div>
            <button
                    ng-click="refreshCachedTree()"
                    class="btn btn--secondary"
                    title="This will clear your current workstate, like opened elements and current searches, but your selected attributes will remain">
                Refresh local data
            </button>
        </div>
    </div>
    <div class="modal-footer modal-footer-std-buttons">
        <button type="button" class="btn btn--primary" ng-click="login()" ng-disabled="!authConfigured()" id="load-tree-data">Login</button>
    </div>
</div>
